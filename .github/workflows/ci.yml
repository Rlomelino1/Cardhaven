# Runs the Playwright suite on push and PR.
#
# This does NOT deploy anything and cannot block a deploy. GitHub Pages publishes
# this repo with "Deploy from a branch" (main / root), which is independent of
# Actions — a failing test here informs a human, it does not wedge the site going
# live. That is the intended behaviour for a one-person project.
#
# The SQL tests (migrations/tests/) are deliberately NOT run here: they need a
# live database and a project-scoped Neon API key, and standing that secret up in
# CI for a suite that changes rarely isn't worth the exposure. Run them locally
# with `npm run test:sql`. See docs/hardening-plan.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The suite blocks esm.sh and serves the repo locally, so it needs no secrets and
# no external network beyond installing dependencies and the browser.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

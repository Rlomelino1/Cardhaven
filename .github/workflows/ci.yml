# Runs the Playwright suite on push and PR.
#
# This job GATES what reaches production. GitHub Pages publishes this repo with
# "Deploy from a branch" (main / root), so Actions cannot block the deploy step
# itself — Pages fires on any push to main, in parallel with this workflow. The
# gate is therefore on what is allowed to REACH main: `main` is a protected
# branch that requires a pull request and requires the `e2e` check below to pass
# before it can be merged. Since a merge is the only way main advances, only code
# with a green suite is ever published.
#
# Consequences worth knowing:
#   - Renaming this job breaks the gate. The required status check is matched by
#     job name, so `e2e` must stay `e2e` (or the protection rule be updated with
#     it, otherwise merges block forever on a check that never reports).
#   - Direct pushes to main are rejected. Work goes through a branch and a PR.
#
# The SQL tests (migrations/tests/) are deliberately NOT run here: they need a
# live database credential, and standing a production connection string up in CI
# for a suite that only changes when a migration does isn't worth the exposure.
# Run them locally with `npm run test:sql`. See docs/hardening-plan.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The suite blocks esm.sh and serves the repo locally, so it needs no secrets and
# no external network beyond installing dependencies and the browser.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

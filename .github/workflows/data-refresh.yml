# Refreshes the card data every Thursday at 14:00 UTC and opens a pull request
# when anything changed. Nothing reaches the site until that PR is merged, so the
# usual review and the `e2e` gate still decide what ships.
#
# scripts/refresh-data.mjs does the work (both games, new sets included) and
# writes the PR description. Run it from the Actions tab with "Run workflow" to
# refresh outside the schedule.
#
# Things this relies on:
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve
#     pull requests" must be on, or `gh pr create` is refused.
#   - A repository secret named DATA_REFRESH_TOKEN: a fine-grained personal access
#     token for this repository with Contents and Pull requests set to read and
#     write. Pushes made with the built-in workflow token start no other workflow,
#     so without it CI never runs on the PR through a pull_request event, and an
#     `e2e` run dispatched by hand does not count toward the required check.
#     Without the secret the job falls back to the workflow token and dispatches
#     CI, which shows the result but leaves the PR blocked.
#   - Each run replaces the data-refresh branch. Merge or close the PR before the
#     next Thursday; edits pushed to it by hand are overwritten.
#   - GitHub may start scheduled runs late when it is busy, and pauses schedules
#     in repositories with no activity for 60 days.

name: Card data refresh

on:
  schedule:
    - cron: "0 14 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: data-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: data-refresh
      GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN || github.token }}
      HAS_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_REFRESH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh both games
        run: node scripts/refresh-data.mjs --summary "$RUNNER_TEMP/summary.md"
      - name: Open or update the pull request
        run: |
          if [ -z "$(git status --porcelain -- data index.html)" ]; then
            echo "The card data is already current."
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A data index.html
          git commit -q -m "Refresh card data ($day)"
          git push -q --force origin "$BRANCH"

          {
            echo "The weekly refresh found changes in the card data. Merging publishes them."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Opened by the Card data refresh workflow. The next run replaces this branch, so merge or close this PR before then."
          } > "$RUNNER_TEMP/body.md"

          title="Card data refresh ($day)"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Run CI on the pull request
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: |
          if git rev-parse -q --verify "refs/heads/$BRANCH" >/dev/null; then
            gh workflow run ci.yml --ref "$BRANCH"
          fi
      # A skipped Riftbound refresh still lets the Pokémon PR through, but fails the
      # run afterwards so GitHub's failure email says the Riftbound data is stale.
      - name: Flag a skipped Riftbound refresh
        run: |
          if grep -q "Not refreshed this time" "$RUNNER_TEMP/summary.md"; then
            echo "::error::Riftbound was not refreshed. See the summary above."
            exit 1
          fi
